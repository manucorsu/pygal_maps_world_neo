[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[project]
name = "pygal_maps_world_neo"
version = "1.1.3"
description = "World maps for pygal (but active)"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [
    { name = "Manuel Corsunsky Gayá", email = "manuelcorsunsky@gmail.com" },
]
requires-python = ">=3.11"
keywords = ["chart", "graph", "maps", "svg", "world"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = ["pygal"]

[dependency-groups]
dev = ["pytest", "pyquery", "ruff"]

[project.entry-points."pygal.maps"]
world = "pygal_maps_world.maps"

[project.entry-points."pygal.test.test_maps"]
world = "pygal_maps_world.test.test_maps"

[project.urls]
Homepage = "https://github.com/manucorsu/pygal_maps_world_neo"
Repository = "https://github.com/manucorsu/pygal_maps_world_neo"
Issues = "https://github.com/manucorsu/pygal_maps_world_neo/issues"

[project.scripts]
check = "pygal_maps_world._check:main"

[tool.uv.build-backend]
module-root = ""
module-name = "pygal_maps_world"

[tool.ruff]
target-version = "py311"

[tool.pyright]
typeCheckingMode = "off"
