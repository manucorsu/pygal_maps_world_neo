[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pygal-maps-world-neo"
version = "1.1.0"
description = "World maps for pygal"
readme = "README.md"
license = "LGPL-3.0-or-later"
authors = [
    { name = "Manuel Corsunsky Gayá", email = "manuelcorsunsky@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["chart", "graph", "maps", "svg", "world"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU Lesser General Public License v3 or later (LGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Presentation",
]
dependencies = ["pygal>=1.9.9"]

[project.entry-points."pygal.maps"]
world = "pygal_maps_world.maps"

[project.entry-points."pygal.test.test_maps"]
world = "pygal_maps_world.test.test_maps"

[project.urls]
Homepage = "https://github.com/manucorsu/pygal_maps_world_neo"
Repository = "https://github.com/manucorsu/pygal_maps_world_neo"
Issues = "https://github.com/manucorsu/pygal_maps_world_neo/issues"

[tool.hatch.version]
path = "pygal_maps_world/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/pygal_maps_world"]

[tool.hatch.build.targets.wheel]
packages = ["pygal_maps_world"]

[tool.hatch.envs.default]
path = ".venv"
